# Branch-only debug APK build.
#
# The tag-driven release workflow publishes artifacts; this one exists so a
# branch can produce an installable APK for the phone without creating a
# GitHub Release. Debug signing matches the build that was verified over adb.
name: Android Debug APK

on:
  push:
    branches: [worktree-scan-connect]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # A fresh runner would otherwise generate a new debug keystore on every
      # run, so each APK had a different signature: the phone needed an
      # uninstall/reinstall (wiping data and changing its UID) every time.
      # Caching the keystore makes consecutive builds update-compatible.
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RelayDesk-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
