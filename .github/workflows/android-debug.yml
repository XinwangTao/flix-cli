# Branch-only debug APK build.
#
# The tag-driven release workflow publishes artifacts; this one exists so a
# branch can produce an installable APK for the phone without creating a
# GitHub Release. Debug signing matches the build that was verified over adb.
name: Android Debug APK

on:
  push:
    branches: [worktree-scan-connect]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # One stable key across branches and tags: a per-runner debug key makes
      # every APK signature different, so updates require uninstall/reinstall
      # (data loss) and can never install over a release. The secret is the
      # canonical copy; the bootstrap artifact below creates it once.
      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p android/keystore
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/debug.keystore
          elif [ ! -f android/keystore/debug.keystore ]; then
            keytool -genkeypair -keystore android/keystore/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod 600 android/keystore/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon -PversionName=2.3.0-dev -PversionCode=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RelayDesk-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload debug keystore (bootstrap)
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-keystore
          path: android/keystore/debug.keystore
          if-no-files-found: warn
