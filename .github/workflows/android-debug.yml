# Branch-only debug APK build.
#
# The tag-driven release workflow publishes artifacts; this one exists so a
# branch can produce an installable APK for the phone without creating a
# GitHub Release. Debug signing matches the build that was verified over adb.
name: Android Debug APK

on:
  push:
    branches: [worktree-scan-connect]
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Same signing identity as every earlier APK. The runner regenerates
      # ~/.android/debug.keystore for each build, so without this the APK ships
      # a brand-new certificate and Android rejects the update
      # (INSTALL_FAILED_UPDATE_INCOMPATIBLE) no matter how correct the bytes are.
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "restored the stable debug keystore"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 is empty; this APK gets a throwaway key and will not install over an existing one"
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Report APK certificate
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep "SHA-256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RelayDesk-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
