# Tag-driven multi-platform release.
#
# `push: tags: v*` builds Windows / macOS (arm64 + x86_64) / Linux / Android in
# parallel, checks every artifact exists, then publishes one GitHub Release with
# a .sha256 next to each download. Anything red before `release` means no
# Release is created; the per-platform artifacts stay downloadable for triage.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v2.3.0)"
        required: true

permissions:
  contents: write

env:
  # workflow_dispatch lets a maintainer re-run a failed build for an existing
  # tag without faking a second push.
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest hypothesis

      # e2e.py needs two machines and fixed ports; GUI tests skip without PySide6.
      - name: Unit tests
        run: pytest tests -q --ignore=tests/e2e.py

      - name: Version matches tag
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["VERSION"].lstrip("v")
          assert version == tag, f"pyproject {version} != tag {tag}"
          print("version", version)
          PY

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pyinstaller

      - name: Build
        run: pyinstaller RelayDesk.spec --noconfirm --clean

      # A windowed (console=False) exe does not hand its exit code back to the
      # calling shell reliably, so assert on the version it prints instead.
      - name: Smoke test
        shell: pwsh
        run: |
          $want = $env:VERSION.TrimStart('v')
          $out = & dist\RelayDesk.exe --version 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch [regex]::Escape($want)) {
            Write-Error "expected version $want, got: $out"
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          $zip = "RelayDesk-$($env:VERSION)-win64.zip"
          Compress-Archive -Path dist\RelayDesk.exe -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" |
            Set-Content "$zip.sha256" -NoNewline
          Get-Content "$zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: RelayDesk-windows
          path: |
            RelayDesk-*.zip
            RelayDesk-*.zip.sha256
          if-no-files-found: error

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15       # Apple Silicon
            arch: arm64
          - runner: macos-15-intel # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pyinstaller

      - name: Build .app
        run: pyinstaller RelayDesk-macos.spec --noconfirm --clean

      - name: Smoke test .app
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/RelayDesk.app/Contents/MacOS/RelayDesk --version

      - name: Package
        run: |
          OUT="RelayDesk-$VERSION-macos-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/RelayDesk.app "$OUT"
          shasum -a 256 "$OUT" | tee "$OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: RelayDesk-macos-${{ matrix.arch }}
          path: |
            RelayDesk-*.zip
            RelayDesk-*.zip.sha256
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Qt needs these to import at all; without them the frozen binary dies
      # before it can print --version.
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pyinstaller

      - name: Build
        run: pyinstaller RelayDesk-linux.spec --noconfirm --clean

      - name: Smoke test
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/RelayDesk --version

      - name: Package
        run: |
          OUT="RelayDesk-$VERSION-linux-x86_64.zip"
          zip -j "$OUT" dist/RelayDesk
          sha256sum "$OUT" | tee "$OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: RelayDesk-linux
          path: |
            RelayDesk-*.zip
            RelayDesk-*.zip.sha256
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Debug signing is deliberate: it is the build that was verified on the
      # tablet over wireless adb, so the released APK installs exactly like the
      # tested one. A release keystore can replace this once one exists.
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Package
        run: |
          OUT="RelayDesk-$VERSION-android.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: RelayDesk-android
          path: |
            RelayDesk-*.apk
            RelayDesk-*.apk.sha256
          if-no-files-found: error

  release:
    needs: [windows, macos, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Verify every endpoint is present
        run: |
          set -euo pipefail
          ls -l dist-artifacts
          expected=(
            "RelayDesk-$VERSION-win64.zip"
            "RelayDesk-$VERSION-macos-arm64.zip"
            "RelayDesk-$VERSION-macos-x86_64.zip"
            "RelayDesk-$VERSION-linux-x86_64.zip"
            "RelayDesk-$VERSION-android.apk"
          )
          for f in "${expected[@]}"; do
            test -f "dist-artifacts/$f" || { echo "missing $f"; exit 1; }
            test -f "dist-artifacts/$f.sha256" || { echo "missing $f.sha256"; exit 1; }
          done

      - name: Release notes from CHANGELOG
        run: |
          python - <<'PY'
          import os, re
          version = os.environ["VERSION"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[v{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[)", text, re.S | re.M)
          body = m.group(1).strip() if m else f"RelayDesk {version}"
          open("notes.md", "w", encoding="utf-8").write(body)
          PY

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --title "RelayDesk $VERSION" \
            --notes-file notes.md \
            dist-artifacts/*
