# GH Bot · 回复与评审
#
# 对应图：docs/archify/gh-bot_workflow.html
#   节点「Claude Code Action」→ 本文件三个 job
#   节点「发布结论」→ 每个 job 由 action 自己维护单条评论
#
# 只读设计：模型不能改代码、不能跑命令，最坏只是发一条烂评论。
# 批准动作不在这里，在 gh-bot-approve.yml（规则引擎独立判定）。
name: GH Bot · 回复与评审

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

# 同一 issue/PR 串行，避免两条评论打架
concurrency:
  group: gh-bot-reply-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  # 本机 cc-switch 代理（self-hosted runner 上才有这个地址）
  ANTHROPIC_BASE_URL: http://127.0.0.1:15721
  ANTHROPIC_AUTH_TOKEN: PROXY_MANAGED
  ANTHROPIC_DEFAULT_SONNET_MODEL: ccs-claude-openai--deepseek-v4.1-flash
  ANTHROPIC_DEFAULT_OPUS_MODEL: ccs-claude-openai--deepseek-v4.1-flash
  ANTHROPIC_DEFAULT_HAIKU_MODEL: ccs-claude-openai--deepseek-v4.1-flash

jobs:
  # ── 新 issue 首轮分诊与回复 ───────────────────────────────
  issue-triage:
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.event.issue.body != '' &&
      github.event.issue.user.type != 'Bot'
    runs-on: [self-hosted, Windows, X64, gh-bot]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 解析 issue 内容
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const policy = JSON.parse(fs.readFileSync('.github/gh-bot-policy.json', 'utf8')).reply;
            const body = context.payload.issue.body || '';
            if (body.length > policy.max_issue_body_chars) {
              core.notice(`issue 正文 ${body.length} 字，超过 ${policy.max_issue_body_chars}，转人工`);
              core.setOutput('skip', 'true');
            } else {
              core.setOutput('skip', 'false');
            }

      - name: Claude 分诊
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: PROXY_MANAGED
          # 复用本机已装的 bun，避免每次从 GitHub CDN 下载（实测 10 分钟以上）
          path_to_bun_executable: ${{ vars.BUN_EXE || 'C:\Users\Administrator\.bun\bin\bun.exe' }}
          prompt: |
            你在给一个公开仓库做新 issue 的首轮分诊。请用中文回复，直接给出结论，不要说客套话。

            输出格式：
            ## 我的理解
            用一两句话复述问题，不确定就写明哪一点不确定。

            ## 初步方向
            最多三条排查方向；需要看代码时用 Read/Grep/Glob 查仓库，不要凭空猜测代码行为。

            ## 需要你补充
            如果缺环境信息（版本、系统、复现步骤、报错原文），列出最多三项。

            约束：不要修改任何文件，不要执行命令，不要承诺修复时间。
          claude_args: |
            --model ccs-claude-openai--deepseek-v4.1-flash
            --allowedTools "Read,Grep,Glob"

  # ── 新 PR 自动评审（只评论，不批准）───────────────────────
  pr-review:
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'ready_for_review') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, gh-bot]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude 评审
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: PROXY_MANAGED
          # 复用本机已装的 bun，避免每次从 GitHub CDN 下载（实测 10 分钟以上）
          path_to_bun_executable: ${{ vars.BUN_EXE || 'C:\Users\Administrator\.bun\bin\bun.exe' }}
          prompt: |
            你在评审这个仓库的一个拉取请求。先看 diff，再按下面的格式输出中文评审意见。

            ## 结论
            一句话：可以直接合 / 建议小改 / 需要重做。

            ## 主要问题
            按严重度排序，最多五条。每条必须写成 `文件路径:行号 — 问题 — 为什么有问题`。
            没有实质问题就写「未发现阻塞性问题」，不要凑数。

            ## 建议
            最多三条，可执行。

            约束：只评论，不修改代码，不运行命令，不给出批准/拒绝的结论。
          claude_args: |
            --model ccs-claude-openai--deepseek-v4.1-flash
            --allowedTools "Read,Grep,Glob"

  # ── 评论里 @claude 的追问 ────────────────────────────────
  mention:
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: [self-hosted, Windows, X64, gh-bot]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Claude 回答追问
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: PROXY_MANAGED
          # 复用本机已装的 bun，避免每次从 GitHub CDN 下载（实测 10 分钟以上）
          path_to_bun_executable: ${{ vars.BUN_EXE || 'C:\Users\Administrator\.bun\bin\bun.exe' }}
          claude_args: |
            --model ccs-claude-openai--deepseek-v4.1-flash
            --allowedTools "Read,Grep,Glob"
