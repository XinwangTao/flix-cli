# Installable release APK for the phone (artifact only, no GitHub Release).
#
# The shipped com.relaydesk.app is signed with the stable debug keystore kept
# in ANDROID_DEBUG_KEYSTORE_B64. Rebuilding it locally with a different
# certificate can never upgrade an installed copy, so the phone build runs
# here with that keystore restored.
#
# Unlike android-debug.yml this builds the release variant: same applicationId
# (com.relaydesk.app), no "-debug" suffix, versionCode from pyproject.toml.
name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [feat/official-bridge]
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "restored the stable debug keystore"
          else
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 is empty; the APK would not install over the existing app"
            exit 1
          fi

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Report APK identity
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK" | head -2 || true
          "$BT/apksigner" verify --print-certs "$APK" | grep "SHA-256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RelayDesk-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
