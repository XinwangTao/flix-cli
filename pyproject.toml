[project]
name = "flixcli"
version = "2.2.1"
description = "flixd + flix CLI: interoperable reimplementation of the Flix LAN transport protocol"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=43,<47",
]

[project.urls]
Homepage = "https://github.com/XinwangTao/flix-cli"
Repository = "https://github.com/XinwangTao/flix-cli"
Changelog = "https://github.com/XinwangTao/flix-cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/XinwangTao/flix-cli/issues"

[project.optional-dependencies]
gui = [
    "PySide6-Essentials==6.9.1",
]
media = [
    "aiortc>=1.10,<2",
    "mss>=10,<11",
    "Pillow>=11,<13",
    "numpy>=2.1,<3",
]

[project.scripts]
flix = "flixcli.cli:main"
flixd = "flixcli.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
