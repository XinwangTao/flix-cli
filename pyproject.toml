[project]
name = "flixcli"
version = "0.1.0"
description = "flixd + flix CLI: interoperable reimplementation of the Flix LAN transport protocol"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
]

[project.scripts]
flix = "flixcli.cli:main"
flixd = "flixcli.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
