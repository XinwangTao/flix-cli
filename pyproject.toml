[project]
name = "flixcli"
version = "0.1.0"
description = "flixd + flix CLI: interoperable reimplementation of the Flix LAN transport protocol"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=43,<47",
]

[project.optional-dependencies]
gui = [
    "PySide6-Essentials==6.9.1",
]
media = [
    "aiortc>=1.10,<2",
    "mss>=10,<11",
    "Pillow>=11,<13",
    "numpy>=2.1,<3",
]

[project.scripts]
flix = "flixcli.cli:main"
flixd = "flixcli.daemon:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
